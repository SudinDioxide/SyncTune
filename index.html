<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SyncTune — Multi-Device Synchronized Music Player</title>
  <meta name="description" content="SyncTune is a multi-device synchronized music player featuring Hi-Res local audio decoding (FLAC, WAV, MP3, ALAC), real-time WebRTC & BroadcastChannel sync, 3-band DSP equalizer, dynamic audio spectrum visualizer, and local storage persistence.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- PeerJS for WebRTC Multi-Device Sync -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <!-- QRCode Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- jsmediatags for ID3 / FLAC metadata extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    /* ==========================================================================
       1. CSS VARIABLES & RESET
       ========================================================================== */
    :root {
      --bg-gradient: radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
                         radial-gradient(circle at 85% 75%, rgba(236, 72, 153, 0.16) 0%, transparent 45%),
                         radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
                         #090b14;
      --bg-base: #090b14;
      --bg-surface: rgba(18, 22, 38, 0.72);
      --bg-surface-elevated: rgba(28, 34, 58, 0.88);
      --bg-glass-card: rgba(255, 255, 255, 0.04);
      --border-glass: rgba(255, 255, 255, 0.09);
      --border-glow: rgba(99, 102, 241, 0.45);
      
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --accent-tertiary: #ec4899;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-glow: 0 0 24px rgba(99, 102, 241, 0.45);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --status-host: #10b981;
      --status-guest: #06b6d4;
      --status-offline: #64748b;
      --status-sync: #f59e0b;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Color Themes */
    body[data-theme="sunset"] {
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(249, 115, 22, 0.2) 0%, transparent 45%),
                     radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.2) 0%, transparent 45%),
                     #0c0a13;
      --accent-primary: #f97316;
      --accent-secondary: #ec4899;
      --accent-tertiary: #eab308;
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #ec4899 60%, #eab308 100%);
      --accent-glow: 0 0 24px rgba(249, 115, 22, 0.45);
    }

    body[data-theme="aurora"] {
      --bg-gradient: radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.18) 0%, transparent 45%),
                     radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.2) 0%, transparent 45%),
                     #061111;
      --accent-primary: #10b981;
      --accent-secondary: #06b6d4;
      --accent-tertiary: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 50%, #3b82f6 100%);
      --accent-glow: 0 0 24px rgba(16, 185, 129, 0.45);
    }

    body[data-theme="violet"] {
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.22) 0%, transparent 45%),
                     radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.2) 0%, transparent 45%),
                     #0a0815;
      --accent-primary: #a855f7;
      --accent-secondary: #6366f1;
      --accent-tertiary: #ec4899;
      --accent-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #d946ef 100%);
      --accent-glow: 0 0 24px rgba(168, 85, 247, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    button, input, select {
      font-family: inherit;
      outline: none;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Glass Effect Utilities */
    .glass-panel {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .glass-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      transition: var(--transition-smooth);
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
    }

    /* ==========================================================================
       2. HEADER & NAVIGATION
       ========================================================================== */
    header {
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 20, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--accent-glow);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .brand-info h1 {
      font-size: 1.25rem;
      background: linear-gradient(120deg, #ffffff 40%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .brand-info span {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Status Pill */
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      transition: var(--transition-smooth);
      white-space: nowrap;
    }

    .sync-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-offline);
      box-shadow: 0 0 8px currentColor;
      transition: var(--transition-smooth);
    }

    .sync-badge.host {
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }
    .sync-badge.host .sync-indicator-dot {
      background: #10b981;
    }

    .sync-badge.guest {
      border-color: rgba(6, 182, 212, 0.35);
      background: rgba(6, 182, 212, 0.1);
      color: #38bdf8;
    }
    .sync-badge.guest .sync-indicator-dot {
      background: #06b6d4;
    }

    .sync-badge.syncing .sync-indicator-dot {
      animation: pulseSync 1.2s infinite;
    }

    @keyframes pulseSync {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: var(--transition-smooth);
      white-space: nowrap;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-action.btn-primary {
      background: var(--accent-gradient);
      border: none;
      box-shadow: var(--accent-glow);
    }

    .btn-action.btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px) scale(1.02);
    }

    .btn-icon-only {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
    }

    /* ==========================================================================
       3. MOBILE TABS NAVIGATION BAR (SHOWN ON MOBILE ONLY)
       ========================================================================== */
    .mobile-tabs-nav {
      display: none;
      background: rgba(14, 17, 30, 0.95);
      border-bottom: 1px solid var(--border-glass);
      padding: 6px 12px;
      gap: 8px;
      position: sticky;
      top: 66px;
      z-index: 90;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .mobile-tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .mobile-tab-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }

    .tab-badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* ==========================================================================
       4. MAIN LAYOUT GRID
       ========================================================================== */
    .app-container {
      max-width: 1540px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 20px;
      flex: 1;
    }

    /* ==========================================================================
       5. PLAYER STAGE & VISUALIZER
       ========================================================================== */
    .stage-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .visualizer-wrapper {
      position: relative;
      height: 380px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-glass);
      background: radial-gradient(circle at 50% 60%, rgba(20, 24, 44, 0.95) 0%, #0b0d18 100%);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .visualizer-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(9, 11, 20, 0.75) 0%, transparent 100%);
    }

    .viz-mode-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(10px);
    }

    .viz-mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition-smooth);
    }

    .viz-mode-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }

    .audio-format-tag {
      font-size: 0.72rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      color: var(--accent-secondary);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Center Vinyl / Artwork */
    .visualizer-center {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .album-art-container {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(99, 102, 241, 0.2);
    }

    .album-art-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1e2438;
      display: block;
      transition: transform 0.5s ease-out;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .album-art-disc.playing {
      animation: spinVinyl 18s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art-disc.paused {
      animation-play-state: paused;
    }

    .album-disc-center-hole {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background: #090b14;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .visualizer-footer {
      position: relative;
      z-index: 2;
      padding: 16px 22px;
      background: linear-gradient(0deg, rgba(9, 11, 20, 0.85) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .track-meta-display {
      min-width: 0;
      flex: 1;
    }

    .track-meta-display h3 {
      font-size: 1.22rem;
      color: #ffffff;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta-display p {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta-display .album-name {
      color: var(--text-dim);
    }

    .sync-latency-pill {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       6. PLAYER CONTROLS PANEL
       ========================================================================== */
    .controls-panel {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Progress bar */
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .timeline-slider-wrap {
      position: relative;
      width: 100%;
      height: 8px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      touch-action: none;
    }

    .timeline-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--accent-gradient);
      width: 0%;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
    }

    .timeline-progress-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 12px var(--accent-primary);
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.1s ease;
      pointer-events: none;
    }

    .timeline-slider-wrap:hover .timeline-progress-thumb {
      opacity: 1;
    }

    .timeline-timestamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* Primary controls buttons */
    .playback-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-control {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-control:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.08);
    }

    .btn-control.active {
      color: var(--accent-secondary);
      background: rgba(6, 182, 212, 0.15);
    }

    .btn-play-hero {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent-gradient);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--accent-glow), 0 8px 24px rgba(0,0,0,0.4);
      transition: var(--transition-smooth);
    }

    .btn-play-hero:hover {
      transform: scale(1.08);
      filter: brightness(1.1);
    }

    .btn-play-hero:active {
      transform: scale(0.96);
    }

    .btn-play-hero svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    /* Volume slider */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 130px;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* ==========================================================================
       7. EQUALIZER & DSP SUITE
       ========================================================================== */
    .dsp-panel {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dsp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .dsp-header h3 {
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eq-preset-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      max-width: 100%;
    }

    .eq-preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .eq-preset-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .eq-preset-btn.active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent-primary);
      color: #ffffff;
      font-weight: 600;
    }

    .eq-sliders-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
    }

    .eq-band-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .eq-band-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .eq-band-freq {
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .eq-slider-vertical-wrap {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .eq-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 6px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.12);
      transform: rotate(-90deg);
      cursor: pointer;
      touch-action: none;
    }

    .eq-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent-secondary);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
      cursor: pointer;
    }

    .eq-band-val {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       8. PLAYLIST & LOCAL DATABASE SIDEBAR
       ========================================================================== */
    .playlist-sidebar {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 640px;
      overflow: hidden;
    }

    .playlist-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .playlist-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-title-row h2 {
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-actions-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-add-music {
      flex: 1;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      transition: var(--transition-smooth);
      white-space: nowrap;
    }

    .btn-add-music:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-add-folder {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      box-shadow: none;
    }

    .btn-add-folder:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .playlist-search-wrap {
      position: relative;
    }

    .playlist-search-wrap input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 8px 12px 8px 34px;
      font-size: 0.82rem;
      color: var(--text-main);
      transition: var(--transition-smooth);
    }

    .playlist-search-wrap input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }

    .playlist-search-wrap svg {
      position: absolute;
      top: 50%;
      left: 11px;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: var(--text-dim);
    }

    /* Drag and drop banner */
    .drop-banner {
      margin: 12px 16px 0;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: var(--transition-smooth);
    }

    .drop-banner.dragover {
      border-color: var(--accent-secondary);
      background: rgba(6, 182, 212, 0.12);
      color: #ffffff;
      transform: scale(1.01);
    }

    /* Track list */
    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .track-item.active {
      background: rgba(99, 102, 241, 0.16);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .track-thumb {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: #1e2438;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-item.active .track-title {
      color: var(--accent-secondary);
    }

    .track-artist {
      font-size: 0.74rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .track-ext-pill {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-secondary);
      font-weight: 600;
      text-transform: uppercase;
    }

    .track-trailing {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-duration {
      font-size: 0.74rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .btn-delete-track {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .btn-delete-track:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    /* Playing equalizer mini animation */
    .mini-equalizer {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .mini-bar {
      width: 3px;
      background: var(--accent-secondary);
      border-radius: 1px;
      animation: miniBounce 1s ease-in-out infinite alternate;
    }
    .mini-bar:nth-child(2) { animation-delay: 0.2s; }
    .mini-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes miniBounce {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .playlist-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border-glass);
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    /* ==========================================================================
       9. MODALS & OVERLAYS (ROOM SYNC & QR CODE)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-smooth);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      max-width: 500px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform: scale(0.94);
      transition: var(--transition-smooth);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .modal-close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
    }

    .modal-header h3 {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }

    .modal-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .room-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: var(--radius-md);
      margin: 16px 0;
      border: 1px solid var(--border-glass);
    }

    .room-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .room-tab-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Host Pane */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
    }

    #qr-canvas-holder {
      background: #ffffff;
      padding: 10px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      min-height: 160px;
    }

    .room-code-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
    }

    .room-code-text {
      font-family: 'Outfit', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent-secondary);
    }

    .btn-copy-code {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-copy-code:hover {
      background: var(--accent-primary);
    }

    .connected-peers-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }

    .peer-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.78rem;
    }

    /* Join Pane */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-stylish {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.92rem;
      color: #ffffff;
      transition: var(--transition-smooth);
    }

    .input-stylish:focus {
      border-color: var(--accent-secondary);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
    }

    /* ==========================================================================
       10. TOAST NOTIFICATIONS
       ========================================================================== */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
      max-width: 90vw;
    }

    .toast-pill {
      background: rgba(18, 22, 38, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .toast-pill.success {
      border-left: 3px solid #10b981;
    }
    .toast-pill.info {
      border-left: 3px solid #06b6d4;
    }
    .toast-pill.warning {
      border-left: 3px solid #f59e0b;
    }

    /* ==========================================================================
       11. MOBILE RESPONSIVE OVERHAUL (SMARTPHONES & TABLETS)
       ========================================================================== */
    @media (max-width: 920px) {
      /* Show Mobile Navigation Bar */
      .mobile-tabs-nav {
        display: flex;
      }

      /* Switch main grid to single column */
      .app-container {
        grid-template-columns: 1fr;
        padding: 12px;
        gap: 12px;
      }

      header {
        padding: 10px 14px;
      }

      .brand-info h1 {
        font-size: 1.1rem;
      }
      .brand-info span {
        display: none;
      }

      .header-center {
        display: none; /* Badge moves to sub-bar or compacted */
      }

      .btn-action span {
        display: none; /* Icons only in header on narrow mobile */
      }
      .btn-action.btn-primary {
        padding: 8px 10px;
      }
      .btn-action.btn-primary span {
        display: inline;
        font-size: 0.75rem;
      }

      /* Mobile Views Switching */
      body[data-mobile-view="player"] .dsp-panel,
      body[data-mobile-view="player"] .playlist-sidebar {
        display: none !important;
      }
      body[data-mobile-view="player"] .visualizer-wrapper,
      body[data-mobile-view="player"] .controls-panel {
        display: flex !important;
      }

      body[data-mobile-view="equalizer"] .visualizer-wrapper,
      body[data-mobile-view="equalizer"] .playlist-sidebar {
        display: none !important;
      }
      body[data-mobile-view="equalizer"] .dsp-panel,
      body[data-mobile-view="equalizer"] .controls-panel {
        display: flex !important;
      }

      body[data-mobile-view="playlist"] .stage-section {
        display: none !important;
      }
      body[data-mobile-view="playlist"] .playlist-sidebar {
        display: flex !important;
        min-height: calc(100vh - 160px);
      }

      /* Responsive Visualizer Stage */
      .visualizer-wrapper {
        height: 250px;
      }

      .album-art-container {
        width: 100px;
        height: 100px;
      }

      .visualizer-header {
        padding: 8px 12px;
      }

      .visualizer-footer {
        padding: 10px 14px;
      }

      .track-meta-display h3 {
        font-size: 1.05rem;
      }

      .controls-panel {
        padding: 16px;
      }

      .playback-toolbar {
        justify-content: space-between;
      }

      .volume-container {
        width: 100px;
      }

      .btn-play-hero {
        width: 54px;
        height: 54px;
      }

      .eq-sliders-grid {
        gap: 10px;
        padding: 12px 6px;
      }

      .eq-slider-vertical-wrap {
        height: 100px;
      }

      .eq-slider {
        width: 90px;
      }
    }
  </style>
</head>
