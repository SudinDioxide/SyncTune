  <!-- ==========================================================================
       MAIN APPLICATION SCRIPT: AUDIO ENGINE, SYNC, VISUALIZER, INDEXEDDB
       ========================================================================== -->
  <script>
    (function() {
      'use strict';

      /* ------------------------------------------------------------------------
       * 1. DATABASE & PERSISTENCE (INDEXEDDB & LOCALSTORAGE)
       * ------------------------------------------------------------------------ */
      const DB_NAME = 'SyncTuneDB';
      const DB_VERSION = 1;
      const STORE_TRACKS = 'tracks';
      let dbInstance = null;

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_TRACKS)) {
              const store = db.createObjectStore(STORE_TRACKS, { keyPath: 'id', autoIncrement: true });
              store.createIndex('name', 'name', { unique: false });
            }
          };
          request.onsuccess = (e) => {
            dbInstance = e.target.result;
            resolve(dbInstance);
          };
          request.onerror = (e) => {
            console.error('IndexedDB Error:', e);
            reject(e);
          };
        });
      }

      function dbSaveTrack(trackData) {
        return new Promise((resolve, reject) => {
          if (!dbInstance) return reject('DB not initialized');
          const tx = dbInstance.transaction(STORE_TRACKS, 'readwrite');
          const store = tx.objectStore(STORE_TRACKS);
          const req = store.add(trackData);
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e);
        });
      }

      function dbGetAllTracks() {
        return new Promise((resolve, reject) => {
          if (!dbInstance) return resolve([]);
          const tx = dbInstance.transaction(STORE_TRACKS, 'readonly');
          const store = tx.objectStore(STORE_TRACKS);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject([]);
        });
      }

      function dbDeleteTrack(id) {
        return new Promise((resolve, reject) => {
          if (!dbInstance) return reject();
          const tx = dbInstance.transaction(STORE_TRACKS, 'readwrite');
          const store = tx.objectStore(STORE_TRACKS);
          const req = store.delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject();
        });
      }

      function dbClearAllTracks() {
        return new Promise((resolve, reject) => {
          if (!dbInstance) return resolve();
          const tx = dbInstance.transaction(STORE_TRACKS, 'readwrite');
          const store = tx.objectStore(STORE_TRACKS);
          const req = store.clear();
          req.onsuccess = () => resolve();
          req.onerror = () => reject();
        });
      }

      const StoragePrefs = {
        get: (key, fallback) => {
          try {
            const val = localStorage.getItem('synctune_' + key);
            return val ? JSON.parse(val) : fallback;
          } catch(e) { return fallback; }
        },
        set: (key, val) => {
          try {
            localStorage.setItem('synctune_' + key, JSON.stringify(val));
          } catch(e) {}
        }
      };

      /* ------------------------------------------------------------------------
       * 2. WEB AUDIO & DSP ENGINE
       * ------------------------------------------------------------------------ */
      let audioCtx = null;
      let audioElement = new Audio();
      audioElement.preload = 'auto';
      audioElement.crossOrigin = 'anonymous';

      let audioSourceNode = null;
      let remoteSourceNode = null;
      let bassFilterNode = null;
      let midFilterNode = null;
      let trebleFilterNode = null;
      let analyserNode = null;
      let gainNode = null;
      let compressorNode = null;
      let streamDestNode = null;

      const EQ_PRESETS = {
        flat:       { bass: 0,   mid: 0,  treble: 0 },
        bass:       { bass: 8,   mid: 0,  treble: -2 },
        vocal:      { bass: -3,  mid: 6,  treble: 2 },
        treble:     { bass: -2,  mid: 1,  treble: 7 },
        rock:       { bass: 5,   mid: -1, treble: 4 },
        electronic: { bass: 7,   mid: 2,  treble: 5 }
      };

      function initAudioContext() {
        if (audioCtx) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });

        // Connect HTMLAudioElement to Web Audio pipeline
        audioSourceNode = audioCtx.createMediaElementSource(audioElement);

        bassFilterNode = audioCtx.createBiquadFilter();
        bassFilterNode.type = 'lowshelf';
        bassFilterNode.frequency.value = 100;

        midFilterNode = audioCtx.createBiquadFilter();
        midFilterNode.type = 'peaking';
        midFilterNode.frequency.value = 1000;
        midFilterNode.Q.value = 1.0;

        trebleFilterNode = audioCtx.createBiquadFilter();
        trebleFilterNode.type = 'highshelf';
        trebleFilterNode.frequency.value = 3500;

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 2048;
        analyserNode.smoothingTimeConstant = 0.82;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = StoragePrefs.get('volume', 0.85);

        compressorNode = audioCtx.createDynamicsCompressor();
        compressorNode.threshold.value = -2.0;
        compressorNode.knee.value = 12;
        compressorNode.ratio.value = 8;
        compressorNode.attack.value = 0.003;
        compressorNode.release.value = 0.25;

        try {
          streamDestNode = audioCtx.createMediaStreamDestination();
        } catch(e) {
          console.warn('MediaStreamDestination not supported', e);
        }

        // Connect the DSP Graph
        audioSourceNode.connect(bassFilterNode);
        bassFilterNode.connect(midFilterNode);
        midFilterNode.connect(trebleFilterNode);
        trebleFilterNode.connect(analyserNode);
        analyserNode.connect(gainNode);
        gainNode.connect(compressorNode);
        compressorNode.connect(audioCtx.destination);

        if (streamDestNode) {
          compressorNode.connect(streamDestNode);
        }

        const savedEQ = StoragePrefs.get('eq_bands', { bass: 0, mid: 0, treble: 0 });
        setEQBand('bass', savedEQ.bass);
        setEQBand('mid', savedEQ.mid);
        setEQBand('treble', savedEQ.treble);
      }

      function setEQBand(band, gainVal) {
        if (!audioCtx) return;
        const val = parseFloat(gainVal);
        if (band === 'bass' && bassFilterNode) bassFilterNode.gain.value = val;
        if (band === 'mid' && midFilterNode) midFilterNode.gain.value = val;
        if (band === 'treble' && trebleFilterNode) trebleFilterNode.gain.value = val;
      }

      /* ------------------------------------------------------------------------
       * 3. SYNTHESIZED BUILT-IN DEMO TRACK (AMBIENT CHILL LO-FI)
       * ------------------------------------------------------------------------ */
      let demoAudioBlobUrl = null;

      function createSynthesizedDemoTrack() {
        const sampleRate = 44100;
        const duration = 8;
        const numSamples = sampleRate * duration;
        const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, numSamples, sampleRate);

        const chordFreqs = [130.81, 164.81, 196.00, 246.94, 293.66]; // C maj9
        chordFreqs.forEach((freq, idx) => {
          const osc = offlineCtx.createOscillator();
          const g = offlineCtx.createGain();
          osc.type = (idx % 2 === 0) ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, 0);

          const lfo = offlineCtx.createOscillator();
          const lfoGain = offlineCtx.createGain();
          lfo.frequency.value = 0.2 + idx * 0.1;
          lfoGain.gain.value = 2.0;
          lfo.connect(osc.frequency);
          lfo.start();

          g.gain.setValueAtTime(0.08 / (idx + 1), 0);
          osc.connect(g);
          g.connect(offlineCtx.destination);
          osc.start();
          osc.stop(duration);
        });

        offlineCtx.startRendering().then(renderedBuffer => {
          const wavBlob = audioBufferToWavBlob(renderedBuffer);
          demoAudioBlobUrl = URL.createObjectURL(wavBlob);
          if (playlist.length === 0) {
            loadTrackIntoPlayer(demoTrackMetadata, false);
          }
        }).catch(e => {
          console.warn('Demo synth offline audio error:', e);
        });
      }

      function audioBufferToWavBlob(buffer) {
        const numOfChan = buffer.numberOfChannels;
        const length = buffer.length * numOfChan * 2 + 44;
        const out = new DataView(new ArrayBuffer(length));
        const channels = [];
        let offset = 0;
        let pos = 0;

        function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952); // "RIFF"
        setUint32(length - 8);
        setUint32(0x45564157); // "WAVE"
        setUint32(0x20746d66); // "fmt "
        setUint32(16); // 16 for PCM
        setUint16(1); // PCM
        setUint16(numOfChan);
        setUint32(buffer.sampleRate);
        setUint32(buffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);
        setUint32(0x61746164); // "data"
        setUint32(length - pos - 4);

        for (let i = 0; i < numOfChan; i++) channels.push(buffer.getChannelData(i));

        while (offset < buffer.length) {
          for (let i = 0; i < numOfChan; i++) {
            let sample = Math.max(-1, Math.min(1, channels[i][offset]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            out.setInt16(pos, sample, true);
            pos += 2;
          }
          offset++;
        }
        return new Blob([out.buffer], { type: 'audio/wav' });
      }

      /* ------------------------------------------------------------------------
       * 4. STATE MANAGEMENT & METADATA THUMBNAILS
       * ------------------------------------------------------------------------ */
      let playlist = [];
      let currentTrackIndex = -1;
      let isPlaying = false;
      let isShuffle = StoragePrefs.get('shuffle', false);
      let loopMode = StoragePrefs.get('loop', 'all');
      let visualizerMode = StoragePrefs.get('viz_mode', 'bars');

      const demoTrackMetadata = {
        id: 'demo_synth_track',
        title: 'SyncTune Chill Dreamscape',
        artist: 'Web Audio Synthesizer',
        album: 'Lossless Hi-Fi',
        ext: 'WAV',
        format: 'WAV 44.1kHz 16-Bit',
        duration: 8,
        coverUrl: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><rect fill='%2312162a' width='200' height='200'/><circle cx='100' cy='100' r='60' fill='%23222a4d'/><path d='M100 70v35c-2-1-4-2-7-2-7 0-13 6-13 13s6 13 13 13 13-6 13-13V82h14V70h-20z' fill='%2306b6d4'/></svg>",
        isDemo: true
      };

      // Resizes cover images into lightweight data URLs (<15KB) safe for WebRTC DataChannels
      function compressCoverArt(dataUrl, maxDim = 160) {
        return new Promise((resolve) => {
          if (!dataUrl || !dataUrl.startsWith('data:image')) {
            return resolve(dataUrl);
          }
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            try {
              resolve(c.toDataURL('image/jpeg', 0.8));
            } catch(e) {
              resolve(dataUrl);
            }
          };
          img.onerror = () => resolve(dataUrl);
          img.src = dataUrl;
        });
      }

      // Prepares full track metadata payload for guests
      function getCurrentTrackPayload() {
        let track = playlist[currentTrackIndex];
        if (!track && (currentTrackIndex === -1 || playlist.length === 0)) {
          track = demoTrackMetadata;
        }
        if (!track) return null;
        return {
          title: track.title || 'Unknown Title',
          artist: track.artist || 'Unknown Artist',
          album: track.album || 'Hi-Fi Audio',
          ext: track.ext || 'AUD',
          format: track.format || `${track.ext || 'SYNC'} STREAM`,
          duration: track.duration || audioElement.duration || 0,
          coverUrl: track.coverUrl
        };
      }

      function applyRemoteTrackMetadata(meta) {
        if (!meta) return;
        document.getElementById('current-title-display').textContent = meta.title || 'Unknown Title';
        document.getElementById('current-artist-display').textContent = meta.artist || 'Unknown Artist';
        document.getElementById('current-album-display').textContent = `• ${meta.album || 'Hi-Fi Audio'}`;
        document.getElementById('format-text').textContent = meta.format || `${meta.ext || 'SYNC'} STREAM`;
        
        if (meta.coverUrl) {
          const img = document.getElementById('album-art-img');
          img.src = meta.coverUrl;
        }
        if (meta.duration && !isNaN(meta.duration)) {
          document.getElementById('time-total').textContent = formatTime(meta.duration);
        }
        document.title = `${meta.title || 'SyncTune'} — SyncTune`;
      }

      /* ------------------------------------------------------------------------
       * 5. CROSS-DEVICE SYNCHRONIZATION (PEERJS + BROADCASTCHANNEL)
       * ------------------------------------------------------------------------ */
      const BROADCAST_NAME = 'synctune_local_sync';
      let broadcastChannel = null;
      try {
        broadcastChannel = new BroadcastChannel(BROADCAST_NAME);
      } catch(e) {
        console.warn('BroadcastChannel not available:', e);
      }

      let peer = null;
      let myPeerId = '';
      let isHost = false;
      let activeConnections = new Map();
      let hostConnection = null;
      let currentRoomCode = '';
      let clockOffset = 0;

      function generateRoomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 6; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return 'TUNE-' + code;
      }

      function initPeerJS(customId = null, asHost = false) {
        if (typeof Peer === 'undefined') {
          console.warn('PeerJS library not loaded.');
          showToast('PeerJS offline. Local multi-tab sync active.', 'warning');
          return;
        }

        const chosenId = customId || ('synctune-' + Math.random().toString(36).substring(2, 9));
        try {
          peer = new Peer(chosenId, {
            debug: 1,
            config: {
              iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
              ]
            }
          });

          peer.on('open', (id) => {
            myPeerId = id;
            if (asHost) {
              isHost = true;
              currentRoomCode = id.replace('synctune-', '').toUpperCase();
              updateHostUI();
              updateSyncBadge('host', `Host: ${currentRoomCode}`);
              showToast(`Room created! Code: ${currentRoomCode}`, 'success');
            }
          });

          peer.on('connection', (conn) => {
            setupHostConnection(conn);
          });

          // Guests receiving Live Audio Stream from Host
          peer.on('call', (call) => {
            call.answer(); // Answer without sending local stream
            call.on('stream', (remoteStream) => {
              initAudioContext();
              if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
              }

              // Pipe stream into Web Audio DSP Graph so guest visualizer dances and EQ works!
              try {
                if (remoteSourceNode) {
                  try { remoteSourceNode.disconnect(); } catch(e) {}
                }
                remoteSourceNode = audioCtx.createMediaStreamSource(remoteStream);
                remoteSourceNode.connect(bassFilterNode);

                // Muted sink element required for WebRTC audio playback in Chrome/Safari
                const sinkAudio = new Audio();
                sinkAudio.srcObject = remoteStream;
                sinkAudio.muted = true;
                sinkAudio.play().catch(() => {});
              } catch(e) {
                console.warn('createMediaStreamSource fallback:', e);
                audioElement.srcObject = remoteStream;
                audioElement.play().catch(err => console.log('Autoplay policy:', err));
              }

              showToast('Receiving Live Host Audio & Visualizer!', 'success');
              updateSyncBadge('guest', 'Live Audio Stream Active');
              setPlayingState(true);
            });
          });

          peer.on('error', (err) => {
            console.error('PeerJS Error:', err);
            if (err.type === 'unavailable-id') {
              initPeerJS(null, asHost);
            } else {
              showToast('Peer notice: ' + (err.message || 'Connecting...'), 'info');
            }
          });

        } catch(e) {
          console.error('Failed to init PeerJS:', e);
        }
      }

      function setupHostConnection(conn) {
        conn.on('open', () => {
          activeConnections.set(conn.peer, conn);
          updateConnectedPeersList();
          showToast(`Device joined room: ${conn.peer.substring(0, 8)}`, 'info');

          // Send current state and full metadata payload to guest
          sendSyncPacketTo(conn, {
            type: 'STATE_SNAPSHOT',
            trackIndex: currentTrackIndex,
            currentTime: audioElement.currentTime,
            isPlaying: isPlaying,
            hostTimestamp: performance.now(),
            trackMeta: getCurrentTrackPayload()
          });

          // Broadcast host audio stream to new peer
          if (streamDestNode && streamDestNode.stream) {
            peer.call(conn.peer, streamDestNode.stream);
          }
        });

        conn.on('data', (data) => {
          handleIncomingSyncPacket(data, conn);
        });

        conn.on('close', () => {
          activeConnections.delete(conn.peer);
          updateConnectedPeersList();
        });
      }

      function joinRoomAsGuest(hostCode, nickname = 'Guest Device') {
        const targetPeerId = hostCode.startsWith('synctune-') ? hostCode : ('synctune-' + hostCode.toLowerCase());
        
        if (!peer || peer.destroyed) {
          initPeerJS();
        }

        setTimeout(() => {
          if (!peer) return;
          showToast(`Connecting to room ${hostCode}...`, 'info');
          const conn = peer.connect(targetPeerId, {
            reliable: true,
            metadata: { nickname: nickname }
          });

          conn.on('open', () => {
            hostConnection = conn;
            isHost = false;
            updateSyncBadge('guest', `Guest: ${hostCode}`);
            showToast(`Connected to Host ${hostCode}!`, 'success');
            document.getElementById('room-modal').classList.remove('open');

            conn.send({ type: 'PING', clientTime: performance.now() });
          });

          conn.on('data', (data) => {
            handleIncomingSyncPacket(data, conn);
          });

          conn.on('close', () => {
            hostConnection = null;
            updateSyncBadge('standby', 'Disconnected from Host');
            showToast('Disconnected from room host', 'warning');
          });

          conn.on('error', (err) => {
            console.error('Connection error:', err);
            showToast('Failed to connect to room. Check code.', 'warning');
          });
        }, 500);
      }

      function broadcastSyncPacket(packet) {
        packet.senderId = myPeerId;
        packet.timestamp = performance.now();
        if (!packet.trackMeta) {
          packet.trackMeta = getCurrentTrackPayload();
        }

        if (broadcastChannel) {
          try {
            broadcastChannel.postMessage(packet);
          } catch(e) {}
        }

        if (isHost && activeConnections.size > 0) {
          activeConnections.forEach((conn) => {
            if (conn.open) {
              conn.send(packet);
            }
          });
        } else if (!isHost && hostConnection && hostConnection.open) {
          hostConnection.send(packet);
        }
      }

      function sendSyncPacketTo(conn, packet) {
        if (conn && conn.open) {
          packet.timestamp = performance.now();
          if (!packet.trackMeta) {
            packet.trackMeta = getCurrentTrackPayload();
          }
          conn.send(packet);
        }
      }

      function handleIncomingSyncPacket(data, sourceConn = null) {
        if (!data || data.senderId === myPeerId) return;

        // Apply incoming song title, artist, album, and cover art
        if (data.trackMeta) {
          applyRemoteTrackMetadata(data.trackMeta);
        }

        switch (data.type) {
          case 'PLAY':
            applySyncPlay(data.currentTime, data.timestamp);
            break;
          case 'PAUSE':
            applySyncPause(data.currentTime);
            break;
          case 'SEEK':
            applySyncSeek(data.currentTime);
            break;
          case 'TRACK_CHANGE':
            applySyncTrackChange(data);
            break;
          case 'STATE_SNAPSHOT':
            applySyncSnapshot(data);
            break;
          case 'PING':
            if (sourceConn) {
              sourceConn.send({
                type: 'PONG',
                clientTime: data.clientTime,
                serverTime: performance.now()
              });
            }
            break;
          case 'PONG':
            const now = performance.now();
            const rtt = now - data.clientTime;
            clockOffset = (data.serverTime - (data.clientTime + rtt / 2));
            const latencyMs = Math.round(rtt / 2);
            document.getElementById('sync-latency-text').textContent = `Latency: ${latencyMs}ms`;
            break;
        }
      }

      if (broadcastChannel) {
        broadcastChannel.onmessage = (e) => {
          handleIncomingSyncPacket(e.data);
        };
      }

      function applySyncPlay(targetTime, hostTimestamp) {
        initAudioContext();
        if (hostTimestamp) {
          const elapsed = (performance.now() - hostTimestamp - clockOffset) / 1000;
          const adjustedTime = Math.max(0, targetTime + Math.max(0, elapsed));
          if (Math.abs(audioElement.currentTime - adjustedTime) > 0.08) {
            audioElement.currentTime = adjustedTime;
          }
        } else {
          audioElement.currentTime = targetTime;
        }

        audioElement.play().then(() => {
          setPlayingState(true);
        }).catch(() => {
          setPlayingState(true);
        });
      }

      function applySyncPause(targetTime) {
        if (typeof targetTime === 'number') {
          audioElement.currentTime = targetTime;
        }
        audioElement.pause();
        setPlayingState(false);
      }

      function applySyncSeek(targetTime) {
        audioElement.currentTime = targetTime;
        updateTimelineUI();
      }

      function applySyncTrackChange(data) {
        if (typeof data.trackIndex === 'number' && playlist[data.trackIndex]) {
          playTrackAtIndex(data.trackIndex, false);
        } else if (data.trackMeta) {
          applyRemoteTrackMetadata(data.trackMeta);
        }
      }

      function applySyncSnapshot(data) {
        if (typeof data.trackIndex === 'number' && playlist[data.trackIndex]) {
          playTrackAtIndex(data.trackIndex, false);
        } else if (data.trackMeta) {
          applyRemoteTrackMetadata(data.trackMeta);
        }

        if (data.isPlaying) {
          applySyncPlay(data.currentTime, data.hostTimestamp);
        } else {
          applySyncPause(data.currentTime);
        }
      }

      /* ------------------------------------------------------------------------
       * 6. METADATA & ALBUM ART EXTRACTION (jsmediatags + fallbacks)
       * ------------------------------------------------------------------------ */
      function parseAudioFileMetadata(file) {
        return new Promise((resolve) => {
          const fallbackTitle = file.name.replace(/\.[^/.]+$/, '');
          const extension = (file.name.split('.').pop() || 'AUDIO').toUpperCase();

          if (typeof jsmediatags !== 'undefined') {
            jsmediatags.read(file, {
              onSuccess: async function(tag) {
                const tags = tag.tags || {};
                let rawCover = null;

                if (tags.picture) {
                  const { data, format } = tags.picture;
                  let base64String = '';
                  for (let i = 0; i < data.length; i++) {
                    base64String += String.fromCharCode(data[i]);
                  }
                  rawCover = `data:${format};base64,${window.btoa(base64String)}`;
                }

                const safeCover = await compressCoverArt(rawCover || generateProceduralCover(fallbackTitle), 160);

                resolve({
                  title: tags.title || fallbackTitle,
                  artist: tags.artist || 'Unknown Artist',
                  album: tags.album || 'Hi-Res Audio',
                  ext: extension,
                  format: `${extension} Local File`,
                  coverUrl: safeCover
                });
              },
              onError: async function() {
                const safeCover = await compressCoverArt(generateProceduralCover(fallbackTitle), 160);
                resolve({
                  title: fallbackTitle,
                  artist: 'Local Artist',
                  album: 'Local Library',
                  ext: extension,
                  format: `${extension} Audio`,
                  coverUrl: safeCover
                });
              }
            });
          } else {
            resolve({
              title: fallbackTitle,
              artist: 'Local Artist',
              album: 'Local Library',
              ext: extension,
              format: `${extension} Audio`,
              coverUrl: generateProceduralCover(fallbackTitle)
            });
          }
        });
      }

      function generateProceduralCover(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const h1 = Math.abs(hash) % 360;
        const h2 = (h1 + 60) % 360;
        return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='hsl(${h1},70%,50%)'/><stop offset='100%' stop-color='hsl(${h2},80%,40%)'/></linearGradient></defs><rect fill='url(%23g)' width='200' height='200'/><circle cx='100' cy='100' r='50' fill='rgba(0,0,0,0.3)'/><polygon points='92,80 118,100 92,120' fill='%23ffffff'/></svg>`;
      }

      /* ------------------------------------------------------------------------
       * 7. PLAYLIST & FOLDER HANDLING (FILES & DIRECTORY TRAVERSAL)
       * ------------------------------------------------------------------------ */
      async function handleFilesSelected(files) {
        if (!files || files.length === 0) return;
        initAudioContext();

        showToast(`Scanning ${files.length} item(s)...`, 'info');
        let addedCount = 0;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          if (!file.type.startsWith('audio') && !/\.(mp3|wav|flac|ogg|m4a|aac|alac)$/i.test(file.name)) {
            continue;
          }

          const meta = await parseAudioFileMetadata(file);
          const trackItem = {
            id: 'track_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            name: file.name,
            size: file.size,
            title: meta.title,
            artist: meta.artist,
            album: meta.album,
            ext: meta.ext,
            format: meta.format,
            coverUrl: meta.coverUrl,
            fileBlob: file,
            duration: 0
          };

          try {
            await dbSaveTrack(trackItem);
          } catch(e) {
            console.warn('DB track save error:', e);
          }

          playlist.push(trackItem);
          addedCount++;
        }

        renderPlaylistUI();
        updateStorageStatus();
        showToast(`Added ${addedCount} audio track(s) to library!`, 'success');

        if (currentTrackIndex === -1 && playlist.length > 0) {
          playTrackAtIndex(0);
        }
      }

      // Recursive folder traversal for Drag-and-Drop
      async function getFilesFromDataTransfer(dataTransfer) {
        const files = [];
        const items = dataTransfer.items;
        if (items) {
          const queue = [];
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.kind === 'file') {
              const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
              if (entry) {
                queue.push(traverseFileTree(entry));
              } else {
                const file = item.getAsFile();
                if (file) files.push(file);
              }
            }
          }
          const results = await Promise.all(queue);
          results.flat().forEach(f => files.push(f));
        } else if (dataTransfer.files) {
          for (let i = 0; i < dataTransfer.files.length; i++) {
            files.push(dataTransfer.files[i]);
          }
        }
        return files;
      }

      function traverseFileTree(item) {
        return new Promise((resolve) => {
          if (item.isFile) {
            item.file(file => resolve([file]), () => resolve([]));
          } else if (item.isDirectory) {
            const dirReader = item.createReader();
            const entries = [];
            const readEntries = () => {
              dirReader.readEntries(async (result) => {
                if (!result.length) {
                  const promises = entries.map(e => traverseFileTree(e));
                  const nested = await Promise.all(promises);
                  resolve(nested.flat());
                } else {
                  for (let i = 0; i < result.length; i++) entries.push(result[i]);
                  readEntries();
                }
              }, () => resolve([]));
            };
            readEntries();
          } else {
            resolve([]);
          }
        });
      }

      function loadTrackIntoPlayer(track, autoPlay = true) {
        initAudioContext();

        let audioSrc = '';
        if (track.isDemo) {
          audioSrc = demoAudioBlobUrl || '';
        } else if (track.fileBlob) {
          audioSrc = URL.createObjectURL(track.fileBlob);
        }

        if (audioSrc) {
          audioElement.src = audioSrc;
          audioElement.load();
        }

        // Update UI
        applyRemoteTrackMetadata(track);

        if (autoPlay) {
          audioElement.play().then(() => {
            setPlayingState(true);
            broadcastSyncPacket({
              type: 'PLAY',
              trackIndex: currentTrackIndex,
              currentTime: 0,
              trackMeta: getCurrentTrackPayload()
            });
          }).catch(e => {
            console.log('Play prevented by autoplay policy:', e);
            setPlayingState(false);
          });
        }
      }

      function playTrackAtIndex(index, shouldBroadcast = true) {
        if (index < 0 || index >= playlist.length) return;
        currentTrackIndex = index;
        const track = playlist[index];
        loadTrackIntoPlayer(track, true);
        renderPlaylistUI();

        if (shouldBroadcast) {
          broadcastSyncPacket({
            type: 'TRACK_CHANGE',
            trackIndex: currentTrackIndex,
            currentTime: 0,
            trackMeta: getCurrentTrackPayload()
          });
        }
      }

      function togglePlayPause() {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        if (currentTrackIndex === -1) {
          if (playlist.length > 0) {
            playTrackAtIndex(0);
          } else {
            loadTrackIntoPlayer(demoTrackMetadata, true);
          }
          return;
        }

        if (audioElement.paused) {
          audioElement.play().then(() => {
            setPlayingState(true);
            broadcastSyncPacket({
              type: 'PLAY',
              trackIndex: currentTrackIndex,
              currentTime: audioElement.currentTime,
              trackMeta: getCurrentTrackPayload()
            });
          }).catch(e => console.log('Autoplay prevented:', e));
        } else {
          audioElement.pause();
          setPlayingState(false);
          broadcastSyncPacket({
            type: 'PAUSE',
            trackIndex: currentTrackIndex,
            currentTime: audioElement.currentTime,
            trackMeta: getCurrentTrackPayload()
          });
        }
      }

      function setPlayingState(playing) {
        isPlaying = playing;
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const albumDisc = document.getElementById('album-art-img');

        if (playing) {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          albumDisc.classList.add('playing');
          albumDisc.classList.remove('paused');
        } else {
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
          albumDisc.classList.add('paused');
        }
        renderPlaylistUI();
      }

      function playNextTrack() {
        if (playlist.length === 0) {
          if (demoAudioBlobUrl) {
            audioElement.currentTime = 0;
            audioElement.play().catch(e => console.log(e));
          }
          return;
        }
        if (loopMode === 'one' && currentTrackIndex !== -1) {
          audioElement.currentTime = 0;
          audioElement.play().catch(e => console.log(e));
          broadcastSyncPacket({
            type: 'PLAY',
            trackIndex: currentTrackIndex,
            currentTime: 0,
            trackMeta: getCurrentTrackPayload()
          });
          return;
        }
        if (isShuffle) {
          let nextIdx = Math.floor(Math.random() * playlist.length);
          if (playlist.length > 1 && nextIdx === currentTrackIndex) {
            nextIdx = (nextIdx + 1) % playlist.length;
          }
          playTrackAtIndex(nextIdx);
        } else {
          let nextIdx = currentTrackIndex + 1;
          if (nextIdx >= playlist.length) {
            if (loopMode === 'all') nextIdx = 0;
            else return;
          }
          playTrackAtIndex(nextIdx);
        }
      }

      function playPrevTrack() {
        if (playlist.length === 0) return;
        if (audioElement.currentTime > 3) {
          audioElement.currentTime = 0;
          broadcastSyncPacket({ type: 'SEEK', currentTime: 0, trackMeta: getCurrentTrackPayload() });
          return;
        }
        let prevIdx = currentTrackIndex - 1;
        if (prevIdx < 0) {
          prevIdx = playlist.length - 1;
        }
        playTrackAtIndex(prevIdx);
      }

      /* ------------------------------------------------------------------------
       * 8. CANVAS SPECTRUM VISUALIZER (BARS, WAVEFORM, RADIAL)
       * ------------------------------------------------------------------------ */
      const canvas = document.getElementById('visualizer-canvas');
      const ctx = canvas.getContext('2d');
      let animFrameId = null;

      function resizeVisualizer() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resizeVisualizer);
      setTimeout(resizeVisualizer, 100);

      function renderVisualizerLoop() {
        animFrameId = requestAnimationFrame(renderVisualizerLoop);

        const width = canvas.width / (window.devicePixelRatio || 1);
        const height = canvas.height / (window.devicePixelRatio || 1);
        ctx.clearRect(0, 0, width, height);

        if (!analyserNode) return;

        const bufferLength = analyserNode.frequencyBinCount;
        const freqData = new Uint8Array(bufferLength);
        const timeData = new Uint8Array(bufferLength);

        analyserNode.getByteFrequencyData(freqData);
        analyserNode.getByteTimeDomainData(timeData);

        if (visualizerMode === 'bars') {
          drawBarsVisualizer(freqData, bufferLength, width, height);
        } else if (visualizerMode === 'wave') {
          drawWaveVisualizer(timeData, bufferLength, width, height);
        } else if (visualizerMode === 'radial') {
          drawRadialVisualizer(freqData, bufferLength, width, height);
        }
      }

      function drawBarsVisualizer(data, length, w, h) {
        const numBars = w < 500 ? 36 : 56;
        const barWidth = (w / numBars) * 0.72;
        const gap = (w / numBars) * 0.28;
        const step = Math.floor(length / (numBars * 1.8));

        for (let i = 0; i < numBars; i++) {
          const val = data[i * step] || 0;
          const percent = val / 255;
          const barHeight = Math.max(4, percent * (h * 0.78));
          const x = i * (barWidth + gap) + gap / 2;
          const y = h - barHeight;

          const grad = ctx.createLinearGradient(0, y, 0, h);
          grad.addColorStop(0, 'rgba(6, 182, 212, 0.95)');
          grad.addColorStop(0.5, 'rgba(99, 102, 241, 0.85)');
          grad.addColorStop(1, 'rgba(236, 72, 153, 0.4)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]) : ctx.rect(x, y, barWidth, barHeight);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x, Math.max(0, y - 3), barWidth, 2);
        }
      }

      function drawWaveVisualizer(data, length, w, h) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#06b6d4';
        ctx.shadowColor = 'rgba(6, 182, 212, 0.8)';
        ctx.shadowBlur = 12;

        ctx.beginPath();
        const sliceWidth = w / length;
        let x = 0;

        for (let i = 0; i < length; i++) {
          const v = data[i] / 128.0;
          const y = (v * h) / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function drawRadialVisualizer(data, length, w, h) {
        const centerX = w / 2;
        const centerY = h / 2;
        const baseRadius = w < 500 ? 55 : 75;
        const totalSpikes = w < 500 ? 44 : 64;
        const step = Math.floor(length / (totalSpikes * 1.5));

        ctx.save();
        ctx.translate(centerX, centerY);

        for (let i = 0; i < totalSpikes; i++) {
          const angle = (i / totalSpikes) * Math.PI * 2;
          const val = data[i * step] || 0;
          const spikeLen = (val / 255) * (w < 500 ? 40 : 55);

          const x1 = Math.cos(angle) * baseRadius;
          const y1 = Math.sin(angle) * baseRadius;
          const x2 = Math.cos(angle) * (baseRadius + spikeLen);
          const y2 = Math.sin(angle) * (baseRadius + spikeLen);

          ctx.strokeStyle = `hsl(${(i * 5 + 180) % 360}, 90%, 65%)`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        ctx.restore();
      }

      /* ------------------------------------------------------------------------
       * 9. UI RENDERING & EVENT LISTENERS
       * ------------------------------------------------------------------------ */
      function renderPlaylistUI() {
        const container = document.getElementById('playlist-container');
        const countBadge = document.getElementById('track-count-badge');
        const mobBadge = document.getElementById('mobile-track-badge');
        const filterText = document.getElementById('playlist-search').value.toLowerCase().trim();

        const countText = `${playlist.length} track${playlist.length === 1 ? '' : 's'}`;
        countBadge.textContent = countText;
        if (mobBadge) mobBadge.textContent = playlist.length;

        if (playlist.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 0.85rem;">
              No local tracks yet.<br>Click "Add Files", "Add Folder" or drag & drop music!
            </div>
          `;
          return;
        }

        let html = '';
        playlist.forEach((track, idx) => {
          if (filterText && !track.title.toLowerCase().includes(filterText) && !track.artist.toLowerCase().includes(filterText)) {
            return;
          }
          const isActive = idx === currentTrackIndex;
          html += `
            <div class="track-item ${isActive ? 'active' : ''}" data-index="${idx}">
              <img class="track-thumb" src="${track.coverUrl}" alt="cover">
              <div class="track-info">
                <div class="track-title">${escapeHtml(track.title)}</div>
                <div class="track-artist">
                  <span>${escapeHtml(track.artist)}</span>
                  <span class="track-ext-pill">${escapeHtml(track.ext || 'AUD')}</span>
                </div>
              </div>
              <div class="track-trailing">
                ${isActive && isPlaying ? `
                  <div class="mini-equalizer">
                    <span class="mini-bar"></span>
                    <span class="mini-bar"></span>
                    <span class="mini-bar"></span>
                  </div>
                ` : ''}
                <button class="btn-delete-track" data-delete-idx="${idx}" title="Remove track">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

        container.querySelectorAll('.track-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.btn-delete-track')) return;
            const idx = parseInt(el.getAttribute('data-index'), 10);
            playTrackAtIndex(idx);
          });
        });

        container.querySelectorAll('.btn-delete-track').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.getAttribute('data-delete-idx'), 10);
            const deleted = playlist.splice(idx, 1)[0];
            if (deleted && deleted.id) {
              await dbDeleteTrack(deleted.id);
            }
            if (currentTrackIndex === idx) {
              if (playlist.length > 0) {
                playTrackAtIndex(Math.min(idx, playlist.length - 1));
              } else {
                audioElement.pause();
                currentTrackIndex = -1;
                setPlayingState(false);
              }
            } else if (currentTrackIndex > idx) {
              currentTrackIndex--;
            }
            renderPlaylistUI();
            updateStorageStatus();
            showToast('Track removed from library', 'info');
          });
        });
      }

      function updateStorageStatus() {
        const statusEl = document.getElementById('storage-status-text');
        statusEl.textContent = `IndexedDB: ${playlist.length} track${playlist.length === 1 ? '' : 's'} saved`;
      }

      function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      function updateTimelineUI() {
        const cur = audioElement.currentTime || 0;
        const dur = audioElement.duration || 0;
        const pct = dur > 0 ? (cur / dur) * 100 : 0;

        document.getElementById('timeline-progress').style.width = pct + '%';
        document.getElementById('timeline-thumb').style.left = pct + '%';
        document.getElementById('time-current').textContent = formatTime(cur);
        if (dur > 0) {
          document.getElementById('time-total').textContent = formatTime(dur);
        }
      }

      function updateSyncBadge(type, text) {
        const badge = document.getElementById('global-sync-badge');
        const label = document.getElementById('sync-status-label');
        badge.className = 'sync-badge ' + type;
        label.textContent = text;
      }

      function renderQRCode(targetUrl) {
        const holder = document.getElementById('qr-canvas-holder');
        if (!holder) return;
        holder.innerHTML = '';
        try {
          if (typeof QRCode !== 'undefined') {
            new QRCode(holder, {
              text: targetUrl,
              width: 160,
              height: 160,
              colorDark: '#090b14',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.M
            });
          }
        } catch(e) {
          console.error('QR render error:', e);
        }
      }

      function updateHostUI() {
        const codeDisplay = document.getElementById('host-room-code-display');
        codeDisplay.textContent = currentRoomCode;

        const hostBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'https://sudindioxide.github.io/SyncTune/'
          : `${window.location.origin}${window.location.pathname}`;
        const joinUrl = `${hostBase}#room=${currentRoomCode}`;

        renderQRCode(joinUrl);
      }

      function updateConnectedPeersList() {
        const container = document.getElementById('connected-peers-box');
        if (activeConnections.size === 0) {
          container.innerHTML = '<div class="peer-badge-row" style="color:var(--text-dim);">Waiting for devices to connect...</div>';
          return;
        }

        let html = '';
        activeConnections.forEach((conn, peerId) => {
          const nick = conn.metadata?.nickname || `Device-${peerId.substring(peerId.length - 4)}`;
          html += `
            <div class="peer-badge-row">
              <span style="font-weight:600;">📱 ${escapeHtml(nick)}</span>
              <span style="color:var(--status-host); font-size:0.7rem;">● Connected</span>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-pill ${type}`;
        toast.innerHTML = `<span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(10px)';
          setTimeout(() => toast.remove(), 300);
        }, 3200);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      /* ------------------------------------------------------------------------
       * 10. SETUP EVENT LISTENERS
       * ------------------------------------------------------------------------ */
      function setupEventListeners() {
        // Play / Pause Hero Button
        document.getElementById('btn-play-pause').addEventListener('click', togglePlayPause);
        document.getElementById('btn-next').addEventListener('click', playNextTrack);
        document.getElementById('btn-prev').addEventListener('click', playPrevTrack);

        // Timeline Seeking
        const timelineBar = document.getElementById('timeline-bar');
        timelineBar.addEventListener('click', (e) => {
          if (!audioElement.duration) return;
          const rect = timelineBar.getBoundingClientRect();
          const clickPos = (e.clientX - rect.left) / rect.width;
          const seekTime = clickPos * audioElement.duration;
          audioElement.currentTime = seekTime;
          updateTimelineUI();
          broadcastSyncPacket({
            type: 'SEEK',
            currentTime: seekTime,
            trackMeta: getCurrentTrackPayload()
          });
        });

        audioElement.addEventListener('timeupdate', updateTimelineUI);
        audioElement.addEventListener('ended', playNextTrack);

        // Mobile Tabs Switcher
        document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.mobile-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const viewKey = btn.getAttribute('data-view');
            document.body.setAttribute('data-mobile-view', viewKey);
            resizeVisualizer();
          });
        });

        // Shuffle & Loop
        const shuffleBtn = document.getElementById('btn-shuffle');
        if (isShuffle) shuffleBtn.classList.add('active');
        shuffleBtn.addEventListener('click', () => {
          isShuffle = !isShuffle;
          shuffleBtn.classList.toggle('active', isShuffle);
          StoragePrefs.set('shuffle', isShuffle);
          showToast(isShuffle ? 'Shuffle enabled' : 'Shuffle disabled', 'info');
        });

        const loopBtn = document.getElementById('btn-loop');
        loopBtn.addEventListener('click', () => {
          if (loopMode === 'all') {
            loopMode = 'one';
            loopBtn.classList.add('active');
            showToast('Repeat One track', 'info');
          } else if (loopMode === 'one') {
            loopMode = 'off';
            loopBtn.classList.remove('active');
            showToast('Repeat Off', 'info');
          } else {
            loopMode = 'all';
            loopBtn.classList.add('active');
            showToast('Repeat All tracks', 'info');
          }
          StoragePrefs.set('loop', loopMode);
        });

        // Volume & Mute
        const volSlider = document.getElementById('volume-range');
        const muteBtn = document.getElementById('btn-mute');
        const volHighIcon = document.getElementById('vol-high-icon');
        const volMuteIcon = document.getElementById('vol-mute-icon');

        volSlider.value = StoragePrefs.get('volume', 0.85);
        volSlider.addEventListener('input', (e) => {
          initAudioContext();
          const val = parseFloat(e.target.value);
          if (gainNode) gainNode.gain.value = val;
          audioElement.volume = val;
          StoragePrefs.set('volume', val);
          if (val === 0) {
            volHighIcon.style.display = 'none';
            volMuteIcon.style.display = 'block';
          } else {
            volHighIcon.style.display = 'block';
            volMuteIcon.style.display = 'none';
          }
        });

        let preMuteVol = 0.85;
        muteBtn.addEventListener('click', () => {
          initAudioContext();
          if (volSlider.value > 0) {
            preMuteVol = volSlider.value;
            volSlider.value = 0;
            if (gainNode) gainNode.gain.value = 0;
            audioElement.volume = 0;
            volHighIcon.style.display = 'none';
            volMuteIcon.style.display = 'block';
          } else {
            volSlider.value = preMuteVol;
            if (gainNode) gainNode.gain.value = preMuteVol;
            audioElement.volume = preMuteVol;
            volHighIcon.style.display = 'block';
            volMuteIcon.style.display = 'none';
          }
        });

        // Visualizer Mode Selector
        document.querySelectorAll('.viz-mode-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.viz-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            visualizerMode = btn.getAttribute('data-mode');
            StoragePrefs.set('viz_mode', visualizerMode);
          });
        });

        // Equalizer Sliders
        const bassInput = document.getElementById('eq-bass');
        const midInput = document.getElementById('eq-mid');
        const trebleInput = document.getElementById('eq-treble');

        function updateEQDisplay() {
          document.getElementById('eq-bass-val').textContent = `${bassInput.value > 0 ? '+' : ''}${bassInput.value} dB`;
          document.getElementById('eq-mid-val').textContent = `${midInput.value > 0 ? '+' : ''}${midInput.value} dB`;
          document.getElementById('eq-treble-val').textContent = `${trebleInput.value > 0 ? '+' : ''}${trebleInput.value} dB`;
        }

        bassInput.addEventListener('input', (e) => {
          initAudioContext();
          setEQBand('bass', e.target.value);
          updateEQDisplay();
          StoragePrefs.set('eq_bands', { bass: bassInput.value, mid: midInput.value, treble: trebleInput.value });
        });
        midInput.addEventListener('input', (e) => {
          initAudioContext();
          setEQBand('mid', e.target.value);
          updateEQDisplay();
          StoragePrefs.set('eq_bands', { bass: bassInput.value, mid: midInput.value, treble: trebleInput.value });
        });
        trebleInput.addEventListener('input', (e) => {
          initAudioContext();
          setEQBand('treble', e.target.value);
          updateEQDisplay();
          StoragePrefs.set('eq_bands', { bass: bassInput.value, mid: midInput.value, treble: trebleInput.value });
        });

        document.querySelectorAll('.eq-preset-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            initAudioContext();
            document.querySelectorAll('.eq-preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const presetKey = btn.getAttribute('data-preset');
            const preset = EQ_PRESETS[presetKey];
            if (preset) {
              bassInput.value = preset.bass;
              midInput.value = preset.mid;
              trebleInput.value = preset.treble;
              setEQBand('bass', preset.bass);
              setEQBand('mid', preset.mid);
              setEQBand('treble', preset.treble);
              updateEQDisplay();
              StoragePrefs.set('eq_bands', preset);
              showToast(`Applied preset: ${btn.textContent}`, 'info');
            }
          });
        });

        // Add Files & Add Folder Buttons
        const fileInput = document.getElementById('audio-file-input');
        const folderInput = document.getElementById('audio-folder-input');

        document.getElementById('btn-add-files').addEventListener('click', () => fileInput.click());
        document.getElementById('btn-add-folder').addEventListener('click', () => folderInput.click());

        fileInput.addEventListener('change', (e) => handleFilesSelected(e.target.files));
        folderInput.addEventListener('change', (e) => handleFilesSelected(e.target.files));

        // Drag & Drop Folder and Files
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(eventName => {
          window.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
          });
        });
        ['dragleave', 'drop'].forEach(eventName => {
          window.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
          });
        });
        window.addEventListener('drop', async (e) => {
          if (e.dataTransfer) {
            const files = await getFilesFromDataTransfer(e.dataTransfer);
            if (files && files.length > 0) {
              handleFilesSelected(files);
            }
          }
        });

        // Search Filter
        document.getElementById('playlist-search').addEventListener('input', renderPlaylistUI);

        // Clear Library Database
        document.getElementById('btn-clear-db').addEventListener('click', async () => {
          if (confirm('Clear all stored tracks from local database?')) {
            await dbClearAllTracks();
            playlist = [];
            currentTrackIndex = -1;
            audioElement.pause();
            audioElement.src = '';
            setPlayingState(false);
            renderPlaylistUI();
            updateStorageStatus();
            showToast('Local audio database cleared', 'info');
          }
        });

        // Theme Switcher
        const themes = ['neon', 'sunset', 'aurora', 'violet'];
        let curThemeIdx = 0;
        document.getElementById('theme-toggle-btn').addEventListener('click', () => {
          curThemeIdx = (curThemeIdx + 1) % themes.length;
          document.body.setAttribute('data-theme', themes[curThemeIdx]);
          showToast(`Theme switched: ${themes[curThemeIdx].toUpperCase()}`, 'info');
        });

        // Room Modal Open / Close
        const roomModal = document.getElementById('room-modal');
        document.getElementById('open-room-modal-btn').addEventListener('click', () => {
          roomModal.classList.add('open');
          if (!isHost && !currentRoomCode) {
            const newCode = generateRoomCode();
            initPeerJS('synctune-' + newCode.toLowerCase(), true);
          }
        });
        document.getElementById('btn-close-modal').addEventListener('click', () => {
          roomModal.classList.remove('open');
        });
        roomModal.addEventListener('click', (e) => {
          if (e.target === roomModal) roomModal.classList.remove('open');
        });

        document.querySelectorAll('.room-tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.room-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const tabKey = btn.getAttribute('data-tab');
            document.getElementById('pane-' + tabKey).classList.add('active');
          });
        });

        document.getElementById('btn-join-room-submit').addEventListener('click', () => {
          const code = document.getElementById('join-room-input').value.trim();
          const nick = document.getElementById('join-nickname-input').value.trim() || 'Guest Device';
          if (!code) {
            showToast('Please enter a room code', 'warning');
            return;
          }
          joinRoomAsGuest(code, nick);
        });

        document.getElementById('btn-copy-room-link').addEventListener('click', () => {
          const hostBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'https://sudindioxide.github.io/SyncTune/' : `${window.location.origin}${window.location.pathname}`;
          const link = `${hostBase}#room=${currentRoomCode}`;
          navigator.clipboard.writeText(link).then(() => {
            showToast('Room link copied to clipboard!', 'success');
          }).catch(() => {
            showToast(`Room Code: ${currentRoomCode}`, 'info');
          });
        });

        if (window.location.hash.includes('room=')) {
          const matchedCode = window.location.hash.split('room=')[1].split('&')[0];
          if (matchedCode) {
            setTimeout(() => {
              joinRoomAsGuest(matchedCode, 'Joined via Link');
            }, 800);
          }
        }
      }

      /* ------------------------------------------------------------------------
       * 11. INITIALIZATION LIFECYCLE
       * ------------------------------------------------------------------------ */
      async function initializeApp() {
        setupEventListeners();
        renderVisualizerLoop();

        try {
          await openDatabase();
          const storedTracks = await dbGetAllTracks();
          if (storedTracks && storedTracks.length > 0) {
            playlist = storedTracks;
            renderPlaylistUI();
            updateStorageStatus();
            loadTrackIntoPlayer(playlist[0], false);
            showToast(`Loaded ${playlist.length} offline tracks from IndexedDB`, 'success');
          } else {
            createSynthesizedDemoTrack();
          }
        } catch(e) {
          console.warn('IndexedDB startup error:', e);
          createSynthesizedDemoTrack();
        }

        const unlockAudio = () => {
          initAudioContext();
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          window.removeEventListener('click', unlockAudio);
          window.removeEventListener('keydown', unlockAudio);
          window.removeEventListener('touchstart', unlockAudio);
        };
        window.addEventListener('click', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApp);
      } else {
        initializeApp();
      }

    })();
  </script>
</body>
</html>
